name: flet_contact_launcher
description: Open Android contact profiles from Flet by phone number
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flet: ">=0.82.0"
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.mi.flet_contact_launcher
        pluginClass: FletContactLauncherPlugin
